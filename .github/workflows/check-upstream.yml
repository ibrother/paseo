name: Check upstream release

on:
  schedule:
    - cron: "17 3 * * *" # 每天一次
  workflow_dispatch:

env:
  UPSTREAM_IMAGE: getpaseo/paseo

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推送 tag
      actions: write # 触发构建工作流
    steps:
      - uses: actions/checkout@v4

      - name: Tag new upstream release and trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${UPSTREAM_IMAGE}:pull" | jq -r .token)
          latest=$(curl -fsS -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/${UPSTREAM_IMAGE}/tags/list?n=10000" \
            | jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "未能获取上游版本" >&2
            exit 1
          fi
          echo "上游最新正式版本: $latest"

          if git ls-remote --exit-code --tags origin "refs/tags/v${latest}" >/dev/null 2>&1; then
            echo "tag v${latest} 已存在，无需构建"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${latest}"
          git push origin "v${latest}"

          # GITHUB_TOKEN 推送的 tag 不会触发 push 事件，改用 workflow_dispatch 显式触发
          gh workflow run docker-publish.yml --ref "v${latest}"
